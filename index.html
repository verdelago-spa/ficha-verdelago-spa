.logo.lg{width:min(280px,60vw)}
.logo.md{width:180px}
.logo.sm{width:84px;margin:0}
.display{font-family:var(--f-display);font-weight:600;color:var(--ink);line-height:1.1}

/* language screen */
.lang-screen{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:36px;text-align:center;padding-block:24px}
.lang-screen .display{font-size:clamp(2.2rem,6vw,3.4rem)}
.choose{color:var(--muted);font-size:.95rem;line-height:1.9;max-width:36rem;margin:0 auto}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.lang-btn{background:var(--card);border:1.5px solid var(--gold);border-radius:var(--r);min-height:96px;font-size:1.45rem;font-weight:500;cursor:pointer;letter-spacing:.02em;transition:background .15s}
.lang-btn:active{background:var(--gold-soft)}
.staff-link{align-self:flex-end;background:none;border:0;color:var(--muted);font-size:.85rem;padding:12px 16px;cursor:pointer;opacity:.7}

/* form chrome */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{background:none;border:1px solid transparent;border-radius:10px;min-width:48px;min-height:44px;font-size:.85rem;letter-spacing:.08em;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:var(--card)}
.form-title{font-size:clamp(1.8rem,4.5vw,2.5rem);margin-bottom:6px}
.intro{color:var(--muted);max-width:40rem;margin:0 0 6px}
.progress{margin:18px 0 20px}
.progress-meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:8px;gap:12px}
.track{height:6px;border-radius:6px;background:var(--gold-soft);overflow:hidden}
.fill{height:100%;background:var(--terra);border-radius:6px;transition:width .3s}
.card{background:var(--card);border:1.5px solid var(--gold);border-radius:var(--r);padding:28px clamp(18px,4vw,36px);display:flex;flex-direction:column;gap:24px}
.sec{font-family:var(--f-body);color:var(--terra);font-size:1.3rem;font-weight:600;display:flex;gap:12px;align-items:baseline;letter-spacing:.01em}
.sec .num{font-size:.95rem;letter-spacing:.1em;color:var(--terra);opacity:.8}
.sec small{font-weight:400;color:var(--muted);font-size:.9rem}
.note{color:var(--muted);font-size:.95rem;margin:0}
.sub{font-weight:600;font-size:1rem;color:var(--ink);margin:4px 0 -8px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl{font-weight:500}
.req{color:var(--terra)}
.hint{font-size:.85rem;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=search],input[type=date],select,textarea{background:#fff;border:1.5px solid var(--gold-soft);border-radius:12px;min-height:56px;padding:12px 16px;width:100%;box-sizing:border-box;font-size:1.05rem}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.invalid input,.invalid select,.invalid textarea,.invalid .sigwrap{border-color:var(--alert)}
.err{color:var(--alert);font-size:.9rem;margin:0}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.phone{display:grid;grid-template-columns:auto 1fr;gap:10px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pill span{display:flex;align-items:center;min-height:56px;padding:0 22px;border:1.5px solid var(--gold-soft);border-radius:999px;background:#fff;cursor:pointer}
.pill input:checked+span{border-color:var(--terra);background:var(--terra-soft);color:var(--terra);font-weight:500}
.pill input:focus-visible+span{outline:3px solid var(--terra);outline-offset:2px}
.check{display:flex;gap:14px;align-items:flex-start;cursor:pointer;min-height:48px;padding-block:6px;position:relative}
.check input{position:absolute;opacity:0;width:32px;height:32px;margin:0}
.check .box{flex:0 0 32px;height:32px;border:1.5px solid var(--gold);border-radius:8px;background:#fff;display:grid;place-items:center;margin-top:-2px}
.check input:checked+.box{background:var(--terra);border-color:var(--terra)}
.check input:checked+.box::after{content:"";width:9px;height:16px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.check input:focus-visible+.box{outline:3px solid var(--terra);outline-offset:2px}
.check-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 20px}
.indent{margin-left:46px}
.group{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.divider{border:0;border-top:1px solid var(--gold-soft);margin:0}
.pval{font-weight:600;color:var(--terra);font-size:1.15rem;min-height:1.6em}
.pval.unset{color:var(--muted);font-weight:400;font-size:.95rem}
.prange{-webkit-appearance:none;appearance:none;width:100%;height:60px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
.prange::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--gold-soft),var(--terra))}
.prange::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--gold-soft),var(--terra))}
.prange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:46px;height:46px;border-radius:50%;background:var(--card);border:3px solid var(--terra);margin-top:-18px;box-shadow:0 2px 6px rgba(59,47,39,.25)}
.prange::-moz-range-thumb{width:40px;height:40px;border-radius:50%;background:var(--card);border:3px solid var(--terra);box-shadow:0 2px 6px rgba(59,47,39,.25)}
.prange.unset::-webkit-slider-thumb{border-color:var(--gold);background:var(--cream);box-shadow:none}
.prange.unset::-moz-range-thumb{border-color:var(--gold);background:var(--cream);box-shadow:none}
.pticks{display:grid;grid-template-columns:repeat(5,1fr);font-size:.9rem;color:var(--muted)}
.pticks span{text-align:center}
.pticks span:first-child{text-align:left}
.pticks span:last-child{text-align:right}
.accrow{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.accrow input[type=text]{max-width:220px;text-transform:uppercase}
.accrow input:disabled{opacity:.4}
.btn.danger{background:var(--alert);border-color:var(--alert);color:#fff}
.s-card.danger h2{color:var(--alert)}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tlist li{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--gold-soft);border-radius:12px;padding:8px 8px 8px 16px;background:#fff}
.exp input[type=text],.exp input[type=date]{max-width:260px}
.exp label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.idle{position:fixed;inset:0;background:rgba(59,47,39,.45);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.idle-box{background:var(--card);border:1.5px solid var(--gold);border-radius:var(--r);padding:32px;max-width:460px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.idle-box h2{font-family:var(--f-display);font-size:2rem;font-weight:600}
.ccbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:0 14px;background:#fff;border:1.5px solid var(--gold-soft);border-radius:12px;cursor:pointer;font-size:1.05rem;white-space:nowrap}
.ccbtn small{color:var(--muted);font-size:.8rem;letter-spacing:.06em}
.ccbtn[aria-expanded="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.ccpanel{border:1.5px solid var(--gold);border-radius:14px;background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px}
.cclist{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cclist li+li{border-top:1px solid var(--cream)}
.cclist li.sep{border-top:2px solid var(--gold-soft)}
.cclist button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 12px;border:0;background:none;text-align:left;cursor:pointer;font-size:1rem;border-radius:8px}
.cclist button:hover,.cclist button[aria-selected="true"]{background:var(--terra-soft)}
.cclist b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;max-height:440px;border:1px solid var(--gold-soft);border-radius:12px;background:#fff}
.tablewrap table{border-collapse:collapse;font-size:.84rem;white-space:nowrap}
.tablewrap th{position:sticky;top:0;background:var(--cream);text-align:left;padding:8px 12px;font-weight:600;color:var(--muted);font-size:.75rem;letter-spacing:.04em}
.tablewrap td{padding:7px 12px;border-top:1px solid var(--cream);max-width:280px;overflow:hidden;text-overflow:ellipsis}
.tablewrap tr:hover td{background:var(--terra-soft)}
.chip.warn{background:var(--warn-bg);border-color:var(--gold);color:#7A5A1E}
.snote{display:block;margin-top:4px;color:#7A5A1E;font-size:.85rem;overflow-wrap:anywhere}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--alert);color:#fff;font-size:.75rem;font-weight:600;box-sizing:border-box}
.tabs button[aria-selected="true"] .badge{background:#fff;color:var(--terra)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;background:var(--warn-bg);border:1px solid var(--gold-soft);border-radius:12px;padding:10px 12px}
.notes li div{overflow-wrap:anywhere}
.notes li small{grid-column:1;color:var(--muted);font-size:.8rem}
.notes li button{grid-row:1/3;grid-column:2}
.s-card.warn{border-color:var(--gold)}
.banner.warn{display:block}
.bars.long .bar{grid-template-columns:minmax(100px,38%) minmax(60px,1fr) 80px}
.alertrow.severe{background:var(--alert);color:#fff}
.alertrow.severe span{color:#fff}
.chip.severe{background:var(--alert);color:#fff;border-color:var(--alert)}
.thanks .quote{font-family:var(--f-display);font-style:italic;font-size:1.5rem;color:var(--gold);max-width:30rem}
@keyframes enter{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:none}}
.enter{animation:enter .5s cubic-bezier(.2,.7,.2,1)}
.delta{display:block;font-style:normal;font-size:.78rem;margin-top:4px;color:var(--muted)}
.delta.up{color:var(--ok)}
.delta.down{color:var(--alert)}
.kpis.six{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.consent{border:1.5px solid var(--gold-soft);border-radius:14px;padding:16px;background:#fff}
.consent p{margin:6px 0 0 46px;font-size:.88rem;color:var(--muted)}
.sigwrap{border:1.5px dashed var(--gold);border-radius:14px;background:#fff;position:relative}
#sig{display:block;width:100%;height:220px;touch-action:none;border-radius:14px;cursor:crosshair}
.sigline{position:absolute;left:24px;right:24px;bottom:48px;border-top:1px solid var(--gold-soft);pointer-events:none}
.sigbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.banner{border-radius:14px;padding:14px 18px;background:var(--warn-bg);border:1px solid var(--gold-soft);font-size:.98rem}
.banner strong{display:block;margin-bottom:2px}
.confirm{background:var(--terra-soft);border-radius:14px;padding:12px 16px}
.nav{display:flex;justify-content:space-between;gap:14px;margin-top:22px}
.btn{min-height:60px;padding:0 30px;border-radius:999px;border:1.5px solid var(--gold);background:var(--card);font-size:1.05rem;font-weight:500;cursor:pointer}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fff;margin-left:auto}
.btn.primary:disabled{opacity:.6}
.btn.ghost{border-color:transparent;background:none}
.btn.small{min-height:44px;padding:0 18px;font-size:.92rem}
.form-err{color:var(--alert);text-align:right;margin:10px 0 0;font-size:.95rem}

/* thanks */
.thanks{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.thanks .display{font-size:clamp(2.6rem,7vw,4rem);color:var(--terra)}
.thanks p{max-width:32rem;margin:0}
.leaf{width:64px;height:64px;border:1.5px solid var(--gold);border-radius:50% 0 50% 0;transform:rotate(45deg)}

/* PIN */
.pin{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:6vh;text-align:center}
.dots{display:flex;gap:16px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gold)}
.dots i.on{background:var(--terra);border-color:var(--terra)}
.keys{display:grid;grid-template-columns:repeat(3,84px);gap:14px}
.keys button{height:84px;border-radius:50%;border:1.5px solid var(--gold-soft);background:var(--card);font-size:1.6rem;cursor:pointer}
.keys button:active{background:var(--gold-soft)}
.keys .txt{font-size:.9rem;border:0;background:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* staff */
.s-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.s-head h1{font-family:var(--f-display);font-size:2rem;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none;background:var(--card);border:1px solid var(--gold-soft);border-radius:999px;padding:4px}
.tabs button{flex:0 0 auto;white-space:nowrap;border:0;background:none;border-radius:999px;min-height:44px;padding:0 18px;cursor:pointer;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--terra);color:#fff}
.s-card{background:var(--card);border:1.5px solid var(--gold-soft);border-radius:var(--r);padding:20px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px;margin-bottom:16px;min-width:0}
.s-card h2{color:var(--terra);font-size:1.1rem;font-weight:600}
.s-card h3{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.s-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.s-bar input{max-width:420px}
.list{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:grid;grid-template-columns:70px minmax(220px,1fr) minmax(0,1.6fr);gap:6px 14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--gold-soft);border-radius:14px;padding:14px 16px;cursor:pointer}
.rowbtn:hover{border-color:var(--gold)}
.rowbtn .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.rowbtn .who{min-width:0}
.rowbtn .who strong{display:block;overflow-wrap:anywhere}
.rowbtn .who small{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:500;letter-spacing:.04em;border:1px solid var(--gold-soft);background:#fff;white-space:nowrap}
.chip.lang{border-color:var(--gold);color:var(--gold)}
.chip.alert{background:var(--alert-bg);border-color:transparent;color:var(--alert)}
.chip.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.chip.new{background:var(--terra-soft);border-color:transparent;color:var(--terra)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;margin:0}
.alerts{display:flex;flex-direction:column;gap:8px}
.alertrow{display:flex;gap:12px;align-items:flex-start;background:var(--alert-bg);color:var(--alert);border-radius:12px;padding:12px 16px;font-weight:500}
.alertrow span{color:var(--ink);font-weight:400;overflow-wrap:anywhere}
.alertrow b{font-size:1.05rem}
.okrow{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 16px}
.kv{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:8px 18px;margin:0}
.kv dt{color:var(--muted);font-size:.92rem}
.kv dd{margin:0;overflow-wrap:anywhere}
.lt{display:inline-block;font-size:.7rem;letter-spacing:.08em;border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:2px}
.sigimg{max-width:320px;border:1px solid var(--gold-soft);border-radius:10px;background:#fff}
.hist{display:flex;flex-direction:column;gap:10px}
.hitem{border-left:3px solid var(--gold-soft);padding:4px 0 4px 14px}
.hitem.cur{border-color:var(--terra)}
.hitem button{background:none;border:0;padding:0;color:var(--terra);text-decoration:underline;cursor:pointer;font-size:.9rem}
.diff{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.diff b{font-weight:500}
.th-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.th-grid .full{grid-column:1/-1}
.msg{font-size:.92rem;margin:0}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--alert)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--card);border:1.5px solid var(--gold-soft);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.85rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:.92rem}
.bt{height:14px;background:var(--cream);border-radius:7px;overflow:hidden}
.bf{display:block;height:100%;background:var(--gold);border-radius:7px}
.bar:first-child .bf{background:var(--terra)}
.bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:200px;padding-top:8px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col i{display:block;width:70%;background:var(--gold);border-radius:6px 6px 0 0;min-height:2px}
.col.cur i{background:var(--terra)}
.col b{font-size:.78rem;font-weight:500;font-variant-numeric:tabular-nums}
.col small{font-size:.72rem;color:var(--muted);white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.grid2 .s-card{margin:0}
.detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.dcol .s-card{margin:0}
@media (max-width:1000px){.detail{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .s-head .tabs{order:3;width:100%;box-sizing:border-box}
  .s-head h1{font-size:1.6rem}
  .tabs button{padding:0 14px}
}
.foot{font-size:.82rem;color:var(--muted);margin:4px 0 0}
.exp{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.exp select{max-width:240px}
.csvbox{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem}
@media (max-width:560px){
  .row2{grid-template-columns:1fr 1.4fr 1fr}
  .phone{grid-template-columns:auto 1fr}
  .rowbtn{grid-template-columns:56px minmax(0,1fr)}
  .rowbtn .chips{grid-column:1/-1;justify-content:flex-start}
  .kv{grid-template-columns:1fr}
  .th-grid{grid-template-columns:1fr}
  .bar{grid-template-columns:90px minmax(0,1fr) 78px}
  .keys{grid-template-columns:repeat(3,72px)}
  .keys button{height:72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    if (w === low || w === w.toLocaleUpperCase()) return low.replace(/(^|[-'’])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase());

}
/* Accepts "912 345 678" with a separate country code, or "+351912345678" / "00351..." in the number field. */
function normPhone(cc, num) {
  let n = (num || "").replace(/[\s.\-()\/]/g, "");
  if (!n) return { ok: true, value: "" };
  if (n.startsWith("00")) n = "+" + n.slice(2);
  if (n.startsWith("+")) return /^\+\d{7,15}$/.test(n) ? { ok: true, value: n } : { ok: false };
  let c = (cc || "").replace(/[\s\-()]/g, "");
  if (c.startsWith("00")) c = "+" + c.slice(2);
  if (c && !c.startsWith("+")) c = "+" + c;
  if (!/^\+\d{1,4}$/.test(c) || !/^\d{6,14}$/.test(n)) return { ok: false };
  return { ok: true, value: c + " " + n };
}

}

/* ---------- signature ---------- */
function initSig() {
  const c = $("#sig"); if (!c) return;
  const r = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const g = c.getContext("2d");
  g.scale(dpr, dpr);
  g.lineWidth = 2.6; g.lineCap = "round"; g.lineJoin = "round";
  g.strokeStyle = g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#3B2F27";
  if (F.signature) { const img = new Image(); img.onload = () => g.drawImage(img, 0, 0, r.width, r.height); img.src = F.signature; }
  let drawing = false, last = null;
  const pt = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.onpointerdown = e => { e.preventDefault(); drawing = true; c.setPointerCapture(e.pointerId); last = pt(e); g.beginPath(); g.arc(last.x, last.y, 1.3, 0, Math.PI * 2); g.fill(); };
  c.onpointermove = e => { if (!drawing) return; const p = pt(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => {
    if (!drawing) return; drawing = false;
    const o = document.createElement("canvas"); o.width = 600; o.height = Math.round(600 * c.height / c.width);
    o.getContext("2d").drawImage(c, 0, 0, o.width, o.height);
    F.signature = o.toDataURL("image/png");
    clearErr("signature");
  };
}

function clearErr(k) {
  if (!ctx.errors[k]) return;
  delete ctx.errors[k];
  const e = app.querySelector(`[data-err="${k}"]`);
  if (e) { e.closest(".invalid")?.classList.remove("invalid"); e.remove(); }
}

/* ---------- validation ---------- */
function validate() {
  const e = {};
  if (step === 1) {
    if (F.name.trim().length < 2) e.name = t("err_required");
    if (F.accType === "guest") {
      F.accCode = normAcc(F.accCode);
      if (!F.accCode) e.accCode = t("err_acc");
      else if (!ACC_RE.test(F.accCode)) e.accCode = t("err_acc_code");
    }
    const anyDob = F.dobD || F.dobM || F.dobY;
    if (!anyDob) e.dob = t("err_required");
    else {
      const d = new Date(+F.dobY, +F.dobM - 1, +F.dobD);
      if (!F.dobD || !F.dobM || !F.dobY || d.getDate() !== +F.dobD || d > new Date()) e.dob = t("err_dob");
    }
    F.name = normName(F.name, true);
    if (!normPhone(F.cc, F.phone).ok) e.phone = t("err_phone");
    if (!F.email.trim()) e.email = t("err_required");
    else if (!EMAIL_RE.test(F.email.trim())) e.email = t("err_email");
  }
  if (step === 2) {
    if (F.allergy && !F.allergyText.trim()) e.allergyText = t("err_detail");
    if (F.medication && !F.medicationText.trim()) e.medicationText = t("err_detail");
    if (F.surgery && !F.surgeryText.trim()) e.surgeryText = t("err_detail");
    if (!F.pregnant) e.pregnant = t("err_choose");
    else if (F.pregnant === "yes") { const w = +F.pregWeeks; if (!Number.isInteger(w) || w < 1 || w > 42) e.pregWeeks = t("err_weeks"); }
  }
  if (step >= 2 && step <= 4 && ctx.prefillFor && !ctx.confirm[step]) e.confirm = t("err_confirm");
  if (step === 5) {
    if (!F.signature) e.signature = t("err_signature");
  }
  return e;
}

    allergy: !!p.allergy, allergyText: p.allergyText || "",

    medication: !!p.medication, medicationText: p.medicationText || "",
    surgery: !!p.surgery, surgeryText: p.surgeryText || "",
    conditions: Array.isArray(p.conditions) ? p.conditions.filter(c => CONDITIONS.includes(c)) : [],
    pressure: p.pressure || "", focus: p.focus || "", avoid: p.avoid || "", notes: p.notes || ""
  });
}
function clearPrefill() {
  const b = blankForm();
  for (const k of ["allergy", "allergyText", "pregnant", "pregWeeks", "medication", "medicationText", "surgery", "surgeryText", "conditions", "pressure", "focus", "avoid", "notes"]) F[k] = b[k];
  ctx.prefillFor = null; ctx.prefillDate = null; ctx.langRestored = false; ctx.confirm = { 2: false, 3: false, 4: false };

async function lookupClient() {
  const id = await clientIdFor(F.email);
  if (ctx.prefillFor && ctx.prefillFor !== id) clearPrefill();
  ctx.clientId = id; ctx.returning = false; ctx.prev = null;
  const d = await dbReady;
  const dob = dobStr();
  if (!d || tabletRole !== "tablet" || !dob) return;
  try {
    // The tablet cannot read clients or forms: only the answers saved under e-mail + date of birth.
    ctx.prefillKey = await prefillKeyFor(F.email, dob);
    const snap = await d.doc("prefill/" + ctx.prefillKey).get();
    if (!snap.exists) return;
    const p = snap.data();
    if (p.clientId !== id) return;
    ctx.returning = true; ctx.prev = p;
    if (ctx.prefillFor === id) return;
    applyPrefill(p);
    ctx.prefillFor = id; ctx.prefillDate = p.lastVisit;
    ctx.confirm = { 2: false, 3: false, 4: false };
    if (p.lang && LANGS.includes(p.lang) && p.lang !== lang) { lang = p.lang; ctx.langRestored = true; }
  } catch (_) { /* treat as a new client */ }
}

function ageBucket(dob, iso) {
  if (!dob) return "b6";
  const b = new Date(dob + "T00:00:00"), d = new Date(iso);
  let a = d.getFullYear() - b.getFullYear();
  if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) a--;
  return a < 25 ? "b0" : a < 35 ? "b1" : a < 45 ? "b2" : a < 55 ? "b3" : a < 65 ? "b4" : "b5";
}

async function next() {

    return;

    ctx.saving = true; render();
    await lookupClient();
    ctx.saving = false;
  }
  if (step === STEPS) {
    ctx.saving = true; render();
    try { await submit(); }
    catch (_) { ctx.saving = false; ctx.formErr = t("err_save"); render(); return; }
    ctx.saving = false;

  step++; render(); window.scrollTo(0, 0);
}

// Points the client record at their most recent remaining form, or removes it when none is left.
async function syncClient(clientId) {
  const cref = db.doc("clients/" + clientId);
  const snap = await db.collection("forms").where("clientId", "==", clientId).limit(1000).get();
  const rem = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const cs = await cref.get();
  if (!rem.length) {
    if (cs.exists && cs.data().email && cs.data().dob) { try { await db.doc("prefill/" + await prefillKeyFor(cs.data().email, cs.data().dob)).delete(); } catch (_) {} }
    await cref.delete();
    try { await db.doc("clientNotes/" + clientId).delete(); } catch (_) {}
    return;
  }
  const prev = cs.exists ? cs.data() : {};
  const last = rem[0];
  const changed = prev.lastFormId !== last.id;
  const withdrawnLater = prev.marketingWithdrawnAt && prev.marketingWithdrawnAt > (last.marketingAt || "");
  await cref.set({
    ...prev,
    email: last.email, name: last.name, phone: last.phone || prev.phone || "", dob: last.dob || prev.dob || "",
    lastLang: last.lang, lastVisit: last.createdAt, firstVisit: rem[rem.length - 1].createdAt,
    lastFormId: last.id, visits: rem.length,
    marketing: changed ? !!last.marketing && !withdrawnLater : !!prev.marketing,
    marketingAt: changed ? (last.marketingAt || "") : (prev.marketingAt || "")
  });
}

/* ---- dashboard ---- */
function pct(n, tot) { return tot ? Math.round(n / tot * 100) : 0; }
function bars(items) {
  const tot = items.reduce((s, x) => s + x.n, 0);
  return `<div class="bars">${items.map(x => `<div class="bar"><span>${esc(x.label)}</span><span class="bt"><span class="bf" style="width:${pct(x.n, tot)}%"></span></span><span class="bv">${x.n} · ${pct(x.n, tot)}%</span></div>`).join("")}</div>`;
}
function ymOf(offset) { const d = new Date(); const x = new Date(d.getFullYear(), d.getMonth() + offset, 1); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`; }
function periodMonths(r) {
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => ymOf(a + i));
  const m = new Date().getMonth();
  if (r === "month") return { cur: [ymOf(0)], prev: [ymOf(-1)] };
  if (r === "prev") return { cur: [ymOf(-1)], prev: [ymOf(-2)] };
  if (r === "year") return { cur: range(-m, 0), prev: range(-m - 12, -12) };
  if (r === "12m") return { cur: range(-11, 0), prev: range(-23, -12) };
  return { cur: range(-23, 0), prev: null };
}
function deltaHtml(cur, prev, kind) {
  if (prev == null) return "";
  let v, txt;
  if (kind === "pp") { v = Math.round(cur - prev); txt = `${v > 0 ? "+" : ""}${v} p.p.`; }
  else { if (!prev) return ""; v = Math.round((cur - prev) / prev * 100); txt = `${v > 0 ? "+" : ""}${v}%`; }
  return `<em class="delta ${v > 0 ? "up" : v < 0 ? "down" : ""}">${v > 0 ? "▲" : v < 0 ? "▼" : "="} ${txt} ${esc(ps("vs_prev"))}</em>`;
}
async function loadStats() {
  if (S.statsLoading) return; S.statsLoading = true;
  const months = Array.from({ length: 24 }, (_, i) => ymOf(-23 + i)), out = {};
  await Promise.all(months.map(async m => { try { const sn = await db.doc("stats/" + m).get(); out[m] = sn.exists ? sn.data() : {}; } catch (_) { out[m] = {}; } }));
  const cnt = async q => { try { return await q.count(); } catch (_) { return 0; } };
  const c = db.collection("clients");
  const [total, back, three, mk] = await Promise.all([cnt(c), cnt(c.where("visits", ">=", 2)), cnt(c.where("visits", ">=", 3)), cnt(c.where("marketing", "==", true))]);
  S.stats = out; S.counts = { total, back, three, mk }; S.statsLoading = false; refreshStaff();
}
// sums one field (or one key of a map field) over a set of months
function sumOf(months, field, key) {
  if (!months) return null;
  return months.reduce((a, m) => { const d = S.stats[m] || {}; const v = key == null ? d[field] : (d[field] || {})[key]; return a + (+v || 0); }, 0);
}
function mapOf(months, field) {
  const out = {};
  months.forEach(m => Object.entries((S.stats[m] || {})[field] || {}).forEach(([k, v]) => { out[k] = (out[k] || 0) + (+v || 0); }));
  return out;
}

}

      if (el.id === "th-treatment-sel") { const o = $("#th-treatment"); o.hidden = el.value !== "__other"; if (!o.hidden) o.focus(); } const m = $("#th-msg"); if (m && m.innerHTML) { m.innerHTML = ""; S.thMsg = ""; } }
    else if (el.id === "mk-lang" && e.type === "change") { S.mkLang = el.value; loadMarketing(); }
    else if (el.dataset.note) { S.noteDirty = !!el.value.trim(); const ne = $("#note-err"); if (ne) ne.hidden = true; }
    else if (el.id === "list-day" && e.type === "change") setListDay(el.value);
    else if (el.id === "bd-month" && e.type === "change") { S.bdMonth = +el.value; renderStaffBody(); }
    else if ((el.id === "rg-from" || el.id === "rg-to") && e.type === "change") { S[el.id === "rg-from" ? "rangeFrom" : "rangeTo"] = el.value; loadRange(); }
    return;
  }
  if (el.id === "cc-search") { renderCcList(); return; }
  if (el.id === "f-pressure") { setPressure(el); return; }
  if (el.dataset.confirm) { ctx.confirm[step] = el.checked; if (el.checked) clearErr("confirm"); return; }
  if (el.dataset.cond) {
    const c = el.dataset.cond;
    F.conditions = el.checked ? [...new Set([...F.conditions, c])] : F.conditions.filter(x => x !== c);
    return;
  }
  const k = el.dataset.k; if (!k) return;
  if (k === "external") {
    F.accType = el.checked ? "external" : "guest";
    const code = $("#f-accCode");
    if (code) { code.disabled = el.checked; if (el.checked) { code.value = ""; F.accCode = ""; } }
    const star = app.querySelector('label[for="f-accCode"] .req'); if (star) star.hidden = el.checked;
    clearErr("accCode"); return;
  }
  if (el.type === "checkbox") F[k] = el.checked;
  else if (el.type === "radio") { if (el.checked) F[k] = el.value; }
  else {
    if (k === "accCode" || k === "name") {
      const p = el.selectionStart;
      el.value = k === "name" ? normName(el.value, false) : el.value.toUpperCase();
      try { el.setSelectionRange(p, p); } catch (_) {}
    }
    F[k] = el.value;
  }
  clearErr(k);
  if (k === "dobD" || k === "dobM" || k === "dobY") clearErr("dob");
  if (k === "cc") clearErr("phone");
  const show = (id, on) => { const w = $("#wrap-" + id); if (w) w.hidden = !on; };
  if (k === "accType") { show("accCode", F.accType === "guest"); clearErr("accCode"); }
  if (k === "allergy") show("allergyText", F.allergy);
  if (k === "medication") show("medicationText", F.medication);
  if (k === "surgery") show("surgeryText", F.surgery);
  if (k === "pregnant") show("pregWeeks", F.pregnant === "yes");
}
app.addEventListener("input", onField);
app.addEventListener("change", onField);
app.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "login-form") doLogin($("#login-email").value.trim(), $("#login-pass").value);
});
app.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#ccpanel") && !$("#ccpanel").hidden) { toggleCc(false); $("#cc-btn").focus(); }
  if (e.key === "Enter" && e.target.id === "cc-search") { e.preventDefault(); $("#cc-list button")?.click(); }
});
// tidy name and accommodation code when the field is left
app.addEventListener("focusout", e => {
  const el = e.target, k = el.dataset && el.dataset.k;
  if (k === "name") { el.value = F.name = normName(el.value, true); }
  if (k === "accCode") { el.value = F.accCode = normAcc(el.value); }
});
// a tap on the slider at its current position still counts as a choice
app.addEventListener("pointerup", e => { if (e.target.id === "f-pressure") setPressure(e.target); });
function setPressure(el) {
  F.pressure = PRESSURES[+el.value] || "";
  const label = t("p_" + F.pressure);
  el.classList.remove("unset");
  el.setAttribute("aria-valuetext", label);
  const pv = $("#pval"); if (pv) { pv.textContent = label; pv.classList.remove("unset"); }
}

// Staff mode closes itself after a period without activity.
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => { lastActivity = Date.now(); }, true));
setInterval(() => {
  if ((view === "staff" || (view === "login" && tabletRole === "tablet")) && Date.now() - lastActivity > CONFIG.STAFF_IDLE_MINUTES * 60000) logout();
}, 20000);

// Client form left unattended: warn, then clear the answers and go back to the start.
const idleEl = document.createElement("div");
idleEl.className = "idle"; idleEl.hidden = true;
document.body.appendChild(idleEl);
setInterval(() => {
  const idle = (Date.now() - lastActivity) / 1000;
  if (view !== "form" || ctx.saving || idle < CONFIG.CLIENT_IDLE_SECONDS) { idleEl.hidden = true; return; }
  const left = Math.ceil(CONFIG.CLIENT_IDLE_SECONDS + CONFIG.CLIENT_GRACE_SECONDS - idle);
  if (left <= 0) { idleEl.hidden = true; resetAll(); return; }
  idleEl.innerHTML = `<div class="idle-box" role="alertdialog" aria-live="assertive"><h2>${esc(t("idle_title"))}</h2><p>${esc(t("idle_text", { n: left }))}</p><button class="btn primary" style="margin:0" type="button">${esc(t("idle_continue"))}</button></div>`;
  idleEl.hidden = false;
}, 1000);
idleEl.addEventListener("click", () => { lastActivity = Date.now(); idleEl.hidden = true; });
// a new form starts the idle clock from zero
app.addEventListener("click", e => { if (e.target.closest('[data-act="lang"]')) lastActivity = Date.now(); }, true);

// Keep the tablet screen on while the app is open (ignored where the device refuses).
let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !navigator.wakeLock || document.visibilityState !== "visible") return;
  try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } catch (_) {}
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("pointerdown", keepAwake, true);
keepAwake();

render();
dbReady.then(d => { view = !d ? "setup" : tabletRole === "tablet" ? "lang" : "login"; render(); });
</script>
</body>
